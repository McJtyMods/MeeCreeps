plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
}

group = 'com.github.mcjty'
base { archivesName = 'meecreeps' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    version = project.neo_version
    runs {
        client { client(); gameDirectory = project.file('run') }
        server { server(); gameDirectory = project.file('run-server'); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'meecreeps'
            sourceSet = sourceSets.gametest
        }
    }
    mods {
        meecreeps { sourceSet sourceSets.main; sourceSet sourceSets.gametest }
    }
}
repositories {
    maven { url = 'https://maven.k-4u.nl' }
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    implementation("com.github.mcjty:mcjtylib:${mcjtylib_version}") { transitive = false }
    compileOnly("mcjty.theoneprobe:theoneprobe:${top_version}") { transitive = false }
    compileOnly "maven.modrinth:interaction-wheel:${interactionwheel_version}"
    if (project.hasProperty('withOptionalMods')) {
        runtimeOnly("mcjty.theoneprobe:theoneprobe:${top_version}") { transitive = false }
        runtimeOnly "maven.modrinth:interaction-wheel:${interactionwheel_version}"
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
java.withSourcesJar()
