plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17.17'
}
group = 'com.github.mcjty'
base { archivesName = 'meecreeps-fabric' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
repositories {
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    maven { url = 'https://maven.fabricmc.net' }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.2.1"
    implementation include("teamreborn:energy:5.0.0")
}
loom {
    runs {
        client { client(); runDir 'run-fabric' }
        server { server(); runDir 'run-server-fabric'; programArg '--nogui' }
    }
}
fabricApi { configureTests { createSourceSet = true; modId = 'meecreeps-test'; enableGameTests = true; enableClientGameTests = false } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-Xmaxerrs', '1000'] }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java.withSourcesJar()
