buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'
// Integrated workspaces supply the shared script; standalone builds use the published branch.
def sharedTools = rootProject.file('gradletools.gradle')
if (rootProject != project && sharedTools.isFile()) {
    apply from: sharedTools
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/26.3_neo/gradletools.gradle'
}
// Maven build number only; the mod dependency requirement stays at 26.3-11.0.0.
ext.mcjtylib_version = '26.3-11.0.0.3'

group = 'com.github.mcjty'
base { archivesName = 'meecreeps' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
repos()
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    version = project.neo_version
    runs {
        if (rootProject.findProject(':workspace') == null || project.name == 'workspace' || project.hasProperty('enable_individual_runs')) {
            client { client(); gameDirectory = project.file('run') }
            server { server(); gameDirectory = project.file('run-server'); programArgument '--nogui' }
            clientData {
                clientData()
                gameDirectory = project.file('run-data')
                programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
            }
            serverData {
                serverData()
                gameDirectory = project.file('run-data')
                programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
            }
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            programArgument '--test'; programArgument 'meecreeps:*'
            sourceSet = sourceSets.gametest
        }
    }
    mods {
        meecreeps { sourceSet sourceSets.main; sourceSet sourceSets.gametest }
    }
}
dependencies {
    mcjtylib()
    top()
    jei()
}

modpublisher(['the-one-probe'], ['mcjtylib'], ['the-one-probe'], ['mcjtylib'], [])

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-Xmaxerrs', '1000'] }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
java.withSourcesJar()
