buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'
def sharedTools = rootProject.file('gradletools.gradle')
if (rootProject != project && sharedTools.isFile()) {
    apply from: sharedTools
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkSpace/26.3_fabric/gradletools.gradle'
}
// Jenkins artifact build only; fabric.mod.json requires the base 11.0.0 release.
ext.mcjtylib_version = '26.3-11.0.0-fabric.1'

group = 'com.github.mcjty'
base { archivesName = 'meecreeps-fabric' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.matching { it.name == 'updateDaemonJvm' }.configureEach {
    languageVersion = JavaLanguageVersion.of(25)
    // Use an installed JDK; this project does not configure JDK download repositories.
    toolchainPlatforms = []
}
repos()
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}
mc()
config()
energy()
mcjtylib()
loom {
    runs {
        client { client(); runDir 'run-fabric' }
        server { server(); runDir 'run-server-fabric'; programArg '--nogui' }
        if (rootProject.findProject(':workspace') == null || project.name == 'workspace' || project.hasProperty('enable_individual_runs')) {
            datagen {
                server()
                name 'Fabric Data Generation'
                vmArg '-Dfabric-api.datagen'
                vmArg '-Dfabric-api.datagen.output-dir=' + file('src/generated/resources').absolutePath
                vmArg '-Dfabric-api.datagen.modid=' + project.mod_id
                runDir 'run-data'
            }
        }
    }
}
fabricApi { configureTests { createSourceSet = true; modId = 'meecreeps-test'; enableGameTests = true; enableClientGameTests = false } }
if (rootProject.findProject(':workspace') != null && project.name != 'workspace' && !project.hasProperty('enable_individual_runs')) {
    // Loom registers default run tasks eagerly; disable them as well as removing IDE configurations.
    ['runClient', 'runServer', 'runClientRenderDoc'].each { taskName ->
        tasks.named(taskName) { enabled = false }
    }
    loom.runs.remove(loom.runs.getByName('client'))
    loom.runs.remove(loom.runs.getByName('server'))
}

modpublisher([], ['fabric-api', 'forge-config-api-port', 'mcjtylib'], [], ['P7dR8mSH', 'ohNO6lps', 'mcjtylib'], [])

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-Xmaxerrs', '1000'] }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java.withSourcesJar()
