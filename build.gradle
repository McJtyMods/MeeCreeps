buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

def sharedTools = rootProject.file('gradletools.gradle')
if (sharedTools.isFile()) {
    apply from: sharedTools
} else if (project.file('gradletools.gradle').isFile()) {
    // Temporary standalone copy while the 26.2 workspace is unpublished.
    apply from: 'gradletools.gradle'
} else if (project.file('../gradletools.gradle').isFile()) {
    apply from: '../gradletools.gradle'
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/26.2_neo/gradletools.gradle'
}

group = 'com.github.mcjty'
base { archivesName = 'meecreeps' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
repos()
runs()
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
// Keep integration tests in their own source set and out of release jars.
extensions.getByName('runs').named('gameTestServer') {
    modSource sourceSets.gametest
    workingDirectory = project.file('run-gametest')
    arguments.addAll '--test', 'meecreeps:*'
}

// The shared script configures clientData; retain the server data run too.
extensions.getByName('runs').create('serverData') {
    arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
}

dependencies {
    mc()
    mcjtylib()
    top()
    jei()
}

modpublisher(['the-one-probe'], ['mcjtylib'], ['the-one-probe'], ['mcjtylib'], [])

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-Xmaxerrs', '1000'] }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
java.withSourcesJar()
